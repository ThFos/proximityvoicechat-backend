<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1921">
    <title>Voice Chat | PGG Legacy</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="https://pgglegacy.gr/media/favicon.png">
    <link href="https://fonts.bunny.net/css?family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --roundness: 0.75rem;
            --accent1: #6b2dd8;
            --accent2: #521eb8;
            --accent2-transp: rgba(82, 30, 184, 0.33);
            --bg1: #1a1921;
            --bg2: #121117;
            --text-muted: rgba(255, 255, 255, 0.7);
            --border-subtle: rgba(255, 255, 255, 0.05);
            --transition-std: 0.3s ease;
            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg1);
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ===== NAVBAR (ίδιο στυλ με pgglegacy.gr) ===== */
        .voice_navbar {
            position: fixed;
            inset: 0 0 auto 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 5.2rem;
            padding: 0 1.5rem 0 1.5rem;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
        }

        .voice_navbar_logo_img {
            width: 9.5rem;
            height: auto;
        }

        .voice_navbar_back {
            font-size: 0.95rem;
            font-weight: 700;
            padding: 0.6rem 1.1rem;
            text-decoration: none;
            color: #fff;
            border: 1px solid var(--accent1);
            border-radius: var(--roundness);
            white-space: nowrap;
            transition: all var(--transition-std);
        }

        .voice_navbar_back:hover {
            border-color: var(--accent2);
            background: var(--accent2);
        }

        /* ===== MAIN CONTENT ===== */
        .voice_main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(5.2rem + 2rem) 1rem 2rem;
        }

        .logo {
            display: block;
            width: 200px;
            height: auto;
            margin: 0 auto 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--bg2);
            border: 1px solid var(--border-subtle);
            border-radius: var(--roundness);
            padding: 2.5rem 2rem;
            text-align: center;
            transition: border-color var(--transition-std);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 1.75rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* ===== LINK SCREEN ===== */
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.25rem;
        }

        #codeInput {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 0.9rem;
            color: #fff;
            font-family: inherit;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 6px;
            text-transform: uppercase;
            outline: none;
            transition: border-color var(--transition-std), box-shadow var(--transition-std);
        }

        #codeInput::placeholder {
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 6px;
        }

        #codeInput:focus {
            border-color: var(--accent1);
            box-shadow: 0 0 0 3px rgba(107, 45, 216, 0.2);
        }

        /* ===== Button style όπως το discord-btn ===== */
        button {
            display: inline-block;
            width: 100%;
            padding: 0.85rem 1.5rem;
            color: #fff;
            text-align: center;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            border: 1px solid var(--accent1);
            border-radius: var(--roundness);
            background: transparent;
            cursor: pointer;
            transition: all var(--transition-std);
        }

        button:hover:not(:disabled) {
            border-color: var(--accent2);
            background: var(--accent2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #errorMsg {
            color: #ff4d4d;
            margin-top: 1rem;
            font-size: 0.9rem;
            min-height: 20px;
            font-weight: 600;
        }

        /* ===== CONNECTED SCREEN ===== */
        #connectedScreen { display: none; }

        .status-box {
            background: var(--bg1);
            border: 1px solid var(--border-subtle);
            border-radius: var(--roundness);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        #playerName {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        #micStatus {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .mic-toggle {
            border-color: #ff4d4d;
            margin-bottom: 1.25rem;
        }

        .mic-toggle:hover {
            background: #ff4d4d;
            border-color: #ff4d4d;
        }

        .mic-toggle.muted {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .mic-toggle.muted:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== VOLUME SLIDER ===== */
        .volume-section {
            background: var(--bg1);
            border: 1px solid var(--border-subtle);
            border-radius: var(--roundness);
            padding: 1rem 1.1rem;
            margin-bottom: 1.75rem;
        }

        .volume-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.7rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .volume-label-row span.value {
            color: var(--accent1);
            font-weight: 700;
        }

        #masterVolumeSlider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            cursor: pointer;
            padding: 0;
            border: none;
        }

        #masterVolumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent1);
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent2-transp);
            transition: transform var(--transition-std);
        }

        #masterVolumeSlider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        #masterVolumeSlider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent1);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px var(--accent2-transp);
        }

        #masterVolumeSlider::-moz-range-track {
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== Nearby Players List ===== */
        .nearby-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
            font-weight: 700;
        }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg1);
            border: 1px solid var(--border-subtle);
            border-radius: var(--roundness);
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            transition: transform var(--transition-std), border-color var(--transition-std);
        }

        .player-item:hover {
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .player-info { text-align: left; }

        .player-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .player-distance {
            font-size: 0.8rem;
            color: var(--accent1);
        }

        .volume-bar {
            width: 60px;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .volume-fill {
            height: 100%;
            background: var(--accent1);
            transition: width 0.2s;
        }

        .no-players {
            color: var(--text-muted);
            text-align: center;
            padding: 1.5rem;
            font-style: italic;
            font-size: 0.9rem;
        }

        /* ===== FOOTER (ίδιο στυλ με pgglegacy.gr) ===== */
        .copyright_div {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 1.5rem 1rem;
            background: #000;
            text-align: center;
        }

        .copyright {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .copyright a {
            color: var(--text-muted);
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .copyright a:hover { color: #fff; }

        @media (max-width: 480px) {
            .container { padding: 1.75rem 1.25rem; }
            .logo { width: 170px; }
            .voice_navbar { padding: 0 1rem; }
            .voice_navbar_logo_img { width: 7.5rem; }
            .voice_navbar_back { font-size: 0.85rem; padding: 0.5rem 0.8rem; }
        }
    </style>
</head>
<body>

<nav class="voice_navbar" aria-label="Voice Chat Navigation">
    <a href="https://pgglegacy.gr" aria-label="PGG Legacy - Αρχική">
        <img class="voice_navbar_logo_img" src="https://pgglegacy.gr/media/logo_small.svg" alt="PGG Legacy Logo">
    </a>
    <a href="https://pgglegacy.gr" class="voice_navbar_back">← Πίσω στο site</a>
</nav>

<main class="voice_main">
    <div style="width: 100%; max-width: 420px;">
        <img class="logo" src="https://pgglegacy.gr/media/logo.svg" alt="PGG Legacy">

        <!-- ========== LINK CODE SCREEN ========== -->
        <div class="container" id="linkScreen">
            <h1>🎤 Voice Chat</h1>
            <p class="subtitle">Γράψε <strong>/vc</strong> στο Minecraft chat και εισάγαγε τον κωδικό που θα λάβεις</p>

            <div class="form-group">
                <input type="text" id="codeInput" maxlength="6" placeholder="------" autocomplete="off">
            </div>
            <button id="linkButton" onclick="submitLinkCode()">Σύνδεση</button>

            <div id="errorMsg"></div>
        </div>

        <!-- ========== CONNECTED SCREEN ========== -->
        <div class="container" id="connectedScreen">
            <div class="status-box">
                <div id="playerName">-</div>
                <div id="micStatus">🎤 Μικρόφωνο: Ενεργό</div>
            </div>

            <button class="mic-toggle" id="micToggleBtn" onclick="toggleMic()">🔇 Σίγαση Μικροφώνου</button>

            <!-- ========== VOLUME SLIDER ========== -->
            <div class="volume-section">
                <div class="volume-label-row">
                    <span>🔊 Γενική Ένταση</span>
                    <span class="value" id="volumeValueDisplay">100%</span>
                </div>
                <input type="range" id="masterVolumeSlider" min="0" max="100" value="100">
            </div>

            <div class="nearby-title">Κοντινοί Παίκτες</div>
            <div id="nearbyPlayers">
                <div class="no-players">Κανένας παίκτης κοντά σου</div>
            </div>
        </div>
    </div>
</main>

<footer class="copyright_div">
    <p class="copyright">
        &copy; <span id="copyright-year"></span> PGG Legacy — All rights reserved. |
        <a href="https://pgglegacy.gr/privacy">Privacy Policy</a>
    </p>
</footer>

<script>
    document.getElementById('copyright-year').textContent = new Date().getFullYear();
</script>
<script src="client.js"></script>
</body>
</html>
